<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DompetKu – Catatan Keuangan</title>
<style>
:root{--bg:#fffdf3;--card:#fff;--tx:#2b2300;--mut:#7a6d3a;--pri:#f5b800;--bd:#f1e3b0;--in:#16915a;--out:#d4432f;--onpri:#2b2300;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17140a;--card:#241f0e;--tx:#fff6d6;--mut:#c9b872;--bd:#3d3513;--in:#4cd08c;--out:#ff7b68;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17140a;--card:#241f0e;--tx:#fff6d6;--mut:#c9b872;--bd:#3d3513;--in:#4cd08c;--out:#ff7b68;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--pri);z-index:10}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--pri);display:flex;gap:4px;padding:8px 12px;align-items:center}
nav b{color:var(--onpri);margin-right:auto;font-size:1.05rem}
nav a{color:var(--onpri);text-decoration:none;padding:7px 12px;border-radius:999px;font-size:.9rem;font-weight:600}
nav a.on{background:#fff;box-shadow:0 1px 3px #0003}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:1.05rem}
.saldo{background:linear-gradient(135deg,#ffd84d,#f5b800);color:#2b2300;border:0}
.saldo .big{font-size:2rem;font-weight:800}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 150px}
.sum{display:flex;gap:10px;margin-top:8px;font-size:.85rem}
.sum span{background:#fff8;border-radius:10px;padding:4px 10px}
.bar{height:8px;border-radius:6px;background:var(--bd);overflow:hidden;margin:3px 0 10px}
.bar i{display:block;height:100%;border-radius:6px}
.top div.l{display:flex;justify-content:space-between;font-size:.9rem}
.tx{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.tx:last-child{border:0}
.tx .d{flex:1;min-width:0}.tx small{color:var(--mut)}
.in{color:var(--in);font-weight:700}.out{color:var(--out);font-weight:700}
button,select,input{font:inherit;color:var(--tx)}
.btn{background:var(--pri);color:var(--onpri);border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid var(--bd);color:var(--tx)}
.x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:1rem}
input,select{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);margin:4px 0 12px}
label{font-size:.85rem;color:var(--mut)}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);cursor:pointer;font-weight:700}
.seg button.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.lock{background:var(--bg);border:1px dashed var(--bd);border-radius:12px;padding:10px 12px;margin:4px 0 12px}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--bd);border-radius:999px;padding:4px 6px 4px 12px;margin:0 6px 6px 0;font-size:.9rem}
.empty{color:var(--mut);text-align:center;padding:14px 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#2b2300;color:#ffe08a;padding:10px 18px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none}
#toast.s{opacity:1}
</style></head><body>
<nav><b>💰 DompetKu</b><a href="#beranda" data-p="beranda">Beranda</a><a href="#input" data-p="input">Input</a><a href="#pengaturan" data-p="pengaturan">Pengaturan</a></nav>
<main id="app"></main><div id="toast"></div>
<script>
const KEY='dompetku_v1',COL=['#f5b800','#e08a00','#ffd84d','#a66a00','#c9a227','#7a5c00','#f0c96b','#8c7b3e'];
let mem=null;
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return mem||{tx:[],cats:['Bensin','Jajan','Makan','Nongkrong','Investasi'],theme:'auto'}}
let S=load(),vm=null,type='out',armed=false;
function save(){mem=S;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const mkey=s=>s.slice(0,7);
const mname=k=>{const[a,b]=k.split('-');return new Date(a,b-1,1).toLocaleDateString('id-ID',{month:'long',year:'numeric'})};
const fmt=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
function toast(m){const t=$('#toast');t.textContent=m;t.className='s';setTimeout(()=>t.className='',1800)}
function theme(){const r=document.documentElement;S.theme==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',S.theme)}

function home(){
  const cur=mkey(dstr(new Date())),k=vm||cur;
  const all=S.tx.reduce((a,t)=>a+(t.type==='in'?t.amt:-t.amt),0);
  const mt=S.tx.filter(t=>mkey(t.date)===k).sort((a,b)=>b.ts-a.ts);
  const inn=mt.filter(t=>t.type==='in').reduce((a,t)=>a+t.amt,0),outt=mt.filter(t=>t.type==='out').reduce((a,t)=>a+t.amt,0);
  const g={};mt.filter(t=>t.type==='out').forEach(t=>g[t.cat]=(g[t.cat]||0)+t.amt);
  const top=Object.entries(g).sort((a,b)=>b[1]-a[1]);
  const months=[...new Set([cur,...S.tx.map(t=>mkey(t.date))])].sort().reverse();
  let list='',acc=0,seg='';
  top.forEach(([c,v],i)=>{const p=v/outt,col=COL[i%COL.length];
    list+=`<div class="l"><span>${esc(c)}</span><b>${fmt(v)}</b></div><div class="bar"><i style="width:${p*100}%;background:${col}"></i></div>`;
    seg+=`<circle r="40" cx="60" cy="60" fill="none" stroke="${col}" stroke-width="22" stroke-dasharray="${p*251.33} 251.33" stroke-dashoffset="${-acc*251.33}" transform="rotate(-90 60 60)"/>`;acc+=p});
  const chart=top.length?`<svg viewBox="0 0 120 120" width="100%" style="max-width:170px;display:block;margin:auto"><circle r="40" cx="60" cy="60" fill="none" stroke="var(--bd)" stroke-width="22"/>${seg}<text x="60" y="64" text-anchor="middle" font-size="9" fill="currentColor">${top.length} kategori</text></svg>`:'';
  const hist=mt.map(t=>`<div class="tx"><div class="d"><b>${t.type==='in'?'Pemasukan':esc(t.cat)}</b>${t.note?' · '+esc(t.note):''}<br><small>${new Date(t.date+'T00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}</small></div><span class="${t.type}">${t.type==='in'?'+':'−'}${fmt(t.amt)}</span><button class="x" data-del="${t.id}" title="Hapus">✕</button></div>`).join('');
  return `<div class="card saldo"><div>Total uang tersisa</div><div class="big">${fmt(all)}</div><div class="sum"><span>Masuk ${mname(k)}: ${fmt(inn)}</span><span>Keluar: ${fmt(outt)}</span></div></div>
  <div class="card"><h2>Pengeluaran terbesar · ${mname(k)}</h2>${top.length?`<div class="row"><div class="top">${list}</div><div>${chart}</div></div>`:'<div class="empty">Belum ada pengeluaran di bulan ini.</div>'}</div>
  <div class="card"><h2>Riwayat transaksi</h2><div class="row" style="margin-bottom:8px"><select id="bln" style="margin:0">${months.map(m=>`<option value="${m}" ${m===k?'selected':''}>${mname(m)}${m===cur?' (bulan ini)':''}</option>`).join('')}</select><button class="btn ghost" id="prev">◀ Riwayat bulan sebelumnya</button></div>${hist||'<div class="empty">Belum ada transaksi.</div>'}</div>`;
}
function input(){
  const today=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  return `<div class="card"><h2>Catat transaksi</h2><div class="seg"><button data-t="out" class="${type==='out'?'on':''}">Pengeluaran</button><button data-t="in" class="${type==='in'?'on':''}">Pemasukan</button></div>
  <label>Nominal (Rp)</label><input id="amt" type="number" inputmode="numeric" min="1" placeholder="contoh: 25000">
  ${type==='out'?`<label>Kategori</label><select id="cat">${S.cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select><label>Atau buat kategori baru</label><input id="newcat" placeholder="contoh: Kuota internet" maxlength="24">`:''}
  <label>Catatan (opsional)</label><input id="note" maxlength="60" placeholder="contoh: makan siang kantin">
  <label>Tanggal (otomatis, tidak bisa diubah)</label><div class="lock">🔒 ${today}</div>
  <button class="btn" id="save" style="width:100%">Simpan</button></div>`;
}
function settings(){
  return `<div class="card"><h2>Tampilan</h2><label>Mode warna</label><select id="th"><option value="auto" ${S.theme==='auto'?'selected':''}>Otomatis (ikut perangkat)</option><option value="light" ${S.theme==='light'?'selected':''}>Light mode</option><option value="dark" ${S.theme==='dark'?'selected':''}>Dark mode</option></select></div>
  <div class="card"><h2>Kategori pengeluaran</h2>${S.cats.map((c,i)=>`<span class="chip">${esc(c)}<button class="x" data-rc="${i}">✕</button></span>`).join('')}<p style="color:var(--mut);font-size:.85rem">Menghapus kategori tidak menghapus transaksi lama.</p></div>
  <div class="card"><h2>Data</h2><p style="font-size:.9rem;color:var(--mut)">Data tersimpan di browser perangkat ini (${S.tx.length} transaksi).</p><button class="btn ghost" id="reset">${armed?'Yakin? Klik lagi untuk hapus semua':'Hapus semua data'}</button></div>`;
}
function render(){
  const p=(location.hash||'#beranda').slice(1);const pg=['beranda','input','pengaturan'].includes(p)?p:'beranda';
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.p===pg));
  $('#app').innerHTML=pg==='beranda'?home():pg==='input'?input():settings();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.del){S.tx=S.tx.filter(x=>x.id!==t.dataset.del);save();render()}
  else if(t.dataset.t){type=t.dataset.t;render()}
  else if(t.dataset.rc!==undefined){if(S.cats.length>1){S.cats.splice(+t.dataset.rc,1);save();render()}else toast('Minimal ada 1 kategori')}
  else if(t.id==='prev'){const o=[...$('#bln').options].map(x=>x.value),i=o.indexOf($('#bln').value);if(i<o.length-1){vm=o[i+1];render()}else toast('Sudah bulan paling awal')}
  else if(t.id==='reset'){if(armed){S.tx=[];armed=false;save();toast('Data dihapus')}else{armed=true}render()}
  else if(t.id==='save'){
    const amt=Math.round(+$('#amt').value);if(!(amt>0))return toast('Isi nominal dulu ya');
    let cat='';
    if(type==='out'){const n=$('#newcat').value.trim();cat=n||$('#cat').value;if(n&&!S.cats.some(c=>c.toLowerCase()===n.toLowerCase()))S.cats.push(n)}
    const now=new Date();
    S.tx.push({id:now.getTime()+''+Math.floor(Math.random()*1e3),type,amt,cat,note:$('#note').value.trim(),date:dstr(now),ts:now.getTime()});
    save();vm=null;toast('Tersimpan ✓');render();
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='bln'){vm=e.target.value;render()}
  if(e.target.id==='th'){S.theme=e.target.value;save();theme()}
});
addEventListener('hashchange',()=>{armed=false;render()});
theme();render();
</script></body></html>
